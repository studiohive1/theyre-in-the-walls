<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input-test</title>
  <link rel="stylesheet" href="https://use.typekit.net/rbr1tka.css">
  <!-- quokka -->
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
  <!-- jersey 25 -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../script.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header id="bar">
    <button id="reroll"></button>
    <div id="progress">
      <span id="count">0/6</span>
    </div>
    <button id="pause"></button>
  </header>

  <div id="challenge" class="playing">
    <div id="talk">
      <img id="henry" src="assets/henry.gif" alt="">
      <p id="question">
        Bert was working on this code.<br>What could it mean?
      </p>
    </div>
    <div id="code"></div>
    <input id="answer" type="text" placeholder="enter answer">
  </div>

  <footer id="help" class="playing">
    <button id="hint"></button>
    <button id="submit">SUBMIT</button>
  </footer>

  <div id="correct">
    <p id="yay">CORRECT!!!!</p>
    <button id="next">NEXT</button>
  </div>
  
  <div id="overlay">
    <div id="popup_box">
      <button id="popup_close"></button>
      <button id="popup_yes"></button>
    </div>
  </div>
  <div id="oops"></div>
  <div id="hint_box">
    <img id="hint_img" src="" alt="">
    <p id="hint_msg"></p>
  </div>
</body>
</html>
