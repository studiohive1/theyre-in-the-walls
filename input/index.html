<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>They're in the walls - input challenge</title>
  <link rel="stylesheet" href="https://use.typekit.net/rbr1tka.css">
  <!-- quokka -->
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
  <!-- jersey 25 -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../script.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="../pause/pause.css">
  <script src="../pause/pause.js" defer></script>
</head>
<body>
  <header id="bar">
    <button id="reroll"></button>
    <div id="progress">
      <span id="count">0/6</span>
    </div>
    <button id="pause"></button>
  </header>

  <div id="challenge" class="playing">
    <div id="talk">
      <img id="henry" src="assets/henry-small-talk.gif" alt="">
      <p id="question"></p>
    </div>
    <div id="code"></div>
    <div id="choices">
      <div class="pick" data-num="1">
        <img id="choice_1">
        <img class="tag" src="assets/this-one.png">
      </div>
      <div class="pick" data-num="2">
        <img id="choice_2">
        <img class="tag" src="assets/this-one.png">
      </div>
    </div>
    <input id="answer" type="text" placeholder="enter answer">
  </div>

  <footer id="help" class="playing">
    <button id="hint"></button>
    <button id="submit">SUBMIT</button>
  </footer>

  <div id="correct">
    <p id="yay">CORRECT!!!!</p>
    <img id="correct_cube" src="assets/cube-correct-input.png" alt="">
    <button id="next">NEXT</button>
    <img id="correct_henry" src="" alt="">
  </div>
  
  <div id="overlay">
    <div id="popup_box">
      <button id="popup_close"></button>
      <button id="popup_yes">YES</button>
    </div>
  </div>
  <div id="oops">
    <img id="oops_cube" src="assets/cube-wrong.png" alt="">
    <div id="oops_bottom">
    <img id="oops_henry" src="assets/henry-wrong.gif" alt="">
    <img id="oops_msg" src="assets/popup-oops.png" alt="">
  </div>
  </div>
  <div id="hint_box">
    <div id="hint_top">
      <img id="hint_title" src="assets/hint-title.png" alt="">
      <button id="hint_close"></button>
    </div>
    <img id="hint_img" src="" alt="">
    <div id="hint_talk">
      <img id="hint_henry" src="assets/henry-hint-map.gif" alt="">
      <p id="hint_msg"></p>
    </div>
  </div>
    <div id="pause_screen">
    <div id="pause_card">
      <p id="pause_title">PAUSE</p>
      <button id="pause_close"></button>
      <div id="you_are_in">
        <p class="cur_label">YOU ARE IN:</p>
        <p id="cur_exhibit">TELECOMMUNICATIONS</p>
      </div>
      <button class="menu" id="resume">
        <img class="btn_icon" src="../pause/assets/resume.png" alt="">RESUME
      </button>
      <button class="menu" id="engineers">
        <img class="btn_icon" src="../pause/assets/silhouette.png" alt="">ENGINEERS FOUND
      </button>
      <button class="menu" id="switch_exhibit">SWITCH EXHIBIT</button>
      <div id="sound_box">
        <div class="sound_each">
          <div class="each_icon" id="icon_sound"></div>
          <p class="each_label">SOUND</p>
          <input class="each_slider" id="slider_sound" type="range" min="0" max="100" value="100">
        </div>
        <div class="sound_each">
          <div class="each_icon" id="icon_dialogue"></div>
          <p class="each_label">DIALOGUE</p>
          <input class="each_slider" id="slider_dialogue" type="range" min="0" max="100" value="100">
        </div>
        <div class="sound_each">
          <div class="each_icon" id="icon_music"></div>
          <p class="each_label">MUSIC</p>
          <input class="each_slider" id="slider_music" type="range" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
