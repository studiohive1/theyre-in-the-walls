<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input-test</title>
  <link rel="stylesheet" href="https://use.typekit.net/rbr1tka.css">
  <!-- quokka -->
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
  <!-- jersey 25 -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header id="bar">
    <button id="reroll"></button>
    <div id="progress"></div>
    <button id="pause"></button>
  </header>

  <div id="challenge">
    <div id="talk">
      <img id="henry" src="assets/henry.gif" alt="">
      <p id="question">
        Bert was working on this code.<br>What could it mean?
      </p>
    </div>
    <div id="code">
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="slash">/</span>
      <span class="dot red"></span>
      <span class="dot red"></span>
      <span class="dot red"></span>
      <span class="slash">/</span>
      <span class="dot red"></span>
      <span class="dot green"></span>
    </div>
    <input id="answer" type="text" placeholder="enter answer">
  </div>

  <footer id="help">
    <button id="hint"></button>
    <button id="submit">SUBMIT</button>
  </footer>
  
  <div id="overlay">
    <div id="popup_box">
      <button id="popup_close"></button>
      <button id="popup_yes"></button>
    </div>
  </div>
</body>
</html>
