<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script>
      AFRAME.registerComponent('sprite', {
        schema: {
          frames: { type: 'number', default: 17 },
          speed: { type: 'number', default: 6 }
        },

        init: function () {
          this.now = 0;
          this.last = 0;

          this.el.addEventListener( 'materialtextureloaded', () => {
            const mesh = this.el.getObject3D('mesh');
            mesh.material.map.wrapS = THREE.RepeatWrapping;
            mesh.material.map.repeat.set( 1 / this.data.frames, 1 );
            mesh.material.map.needsUpdate = true;
          });
        },

        tick: function ( time ) {
          const mesh = this.el.getObject3D('mesh');
          if ( !mesh ) return;
          if ( !mesh.material.map ) return;

          if ( time - this.last < 1000 / this.data.speed ) return;
          this.last = time;

          this.now = ( this.now + 1 ) % this.data.frames;
          mesh.material.map.offset.x = this.now / this.data.frames;
        }
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="assets/samuel-morse.png" sprite="frames: 22; speed: 6" position="0 0.1 0.1" width="0.5" height="0.5" transparent="true"></a-plane>
        <!-- <a-plane src="assets/sparkle.png" sprite="frames: 9; speed: 6" position="-0.3 0.5 0.11" width="0.25" height="0.25" transparent="true"></a-plane>
        <a-plane src="assets/sparkle2.png" sprite="frames: 11; speed: 5" position="0.3 0.3 0.12" width="0.25" height="0.25" transparent="true"></a-plane> -->
      </a-entity>
    </a-scene>
    <div id="back_eft_top"></div>
    <div id="back_eft_bottom"></div>
    <header id="bar">
      <button id="pause"></button>
    </header>
    <div id="frame"></div>
  </body>
</html>
