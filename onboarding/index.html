<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onboarding-test</title>
  <link rel="stylesheet" href="https://use.typekit.net/rbr1tka.css">
  <!-- quokka -->
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
  <!-- jersey 25 -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../script.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="back_eft_top"></div>
  <div id="back_eft_bottom"></div>

  <header id="bar">
    <button id="back"></button>
    <button id="pause"></button>
  </header>

  <div class="step on" id="p1">
    <div class="henry walk"></div>
    <p class="tap">tap on screen</p>
  </div>
  <div class="step" id="p2">
    <p class="textbox">Hi there!<br>I'm Henry, and your name is?</p>
    <div class="henry wave"></div>
  </div>
  <div class="step" id="p3">
    <div class="henry wave_only"></div>
    <p class="label">enter your name</p>
    <input id="name_box" placeholder="type your name">
    <button id="thats_me">THAT'S ME!</button>
  </div>
  <div class="step" id="p4"></div>
</body>
</html>
