<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dice-test</title>
    <link rel="stylesheet" href="https://use.typekit.net/rbr1tka.css">
    <!-- quokka -->
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <!-- jersey 25 -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="../pause/pause.css">
    <script src="../pause/pause.js" defer></script>
</head>
<body>
    <div id="back_eft_top"></div>
    <div id="back_eft_bottom"></div>
    <header id="bar">
        <div id="progress">
            <span id="count">0/6</span>
        </div>
        <button id="pause"></button>
    </header>
    <button id="action_btn">ROLL THE DICE!</button>
    <img id="card">
    <div id="reroll_bar">
      <div id="reroll_count">
        <span class="hex"></span>
        <span class="hex"></span>
        <span class="hex"></span>
      </div>
      <p id="reroll_title">RE-ROLL</p>
    </div>
      <div id="pause_screen">
    <div id="pause_card">
      <p id="pause_title">PAUSE</p>
      <button id="pause_close"></button>
      <div id="you_are_in">
        <p class="cur_label">YOU ARE IN:</p>
        <p id="cur_exhibit">TELECOMMUNICATIONS</p>
      </div>
      <button class="menu" id="resume">
        <img class="btn_icon" src="../pause/assets/resume.png" alt="">RESUME
      </button>
      <button class="menu" id="engineers">
        <img class="btn_icon" src="../pause/assets/silhouette.png" alt="">ENGINEERS FOUND
      </button>
      <button class="menu" id="switch_exhibit">SWITCH EXHIBIT</button>
      <div id="sound_box">
        <div class="sound_each">
          <div class="each_icon" id="icon_sound"></div>
          <p class="each_label">SOUND</p>
          <input class="each_slider" id="slider_sound" type="range" min="0" max="100" value="100">
        </div>
        <div class="sound_each">
          <div class="each_icon" id="icon_dialogue"></div>
          <p class="each_label">DIALOGUE</p>
          <input class="each_slider" id="slider_dialogue" type="range" min="0" max="100" value="100">
        </div>
        <div class="sound_each">
          <div class="each_icon" id="icon_music"></div>
          <p class="each_label">MUSIC</p>
          <input class="each_slider" id="slider_music" type="range" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
